[package]
name = "mistralrs-android"
version = "0.1.0"
edition = "2021"
description = "JNI bindings for running mistral.rs inference on Android."
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "mistralrs_android"

[dependencies]
jni = "0.21"
mistralrs = { path = "../mistralrs", version = "0.9.3" }
mistralrs-core = { path = "../mistralrs-core", version = "0.9.3" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
